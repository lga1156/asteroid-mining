branch_protection:
  policies:
    - target: branch
      matches: "main"
      rules:
        - prevent_deletion
        - prevent_force_push
        - prevent_non_pr_changes
    - target: branch
      matches: "release"
      rules:
        - prevent_deletion
    - target: tag
      matches: "v*"
      rules:
        - prevent_deletion

pull_request: 
  branch_cleanup: 
    matches: ["**"]
